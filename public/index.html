<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="VIZARD — чат со сквозным шифрованием. Ключ — это комната.">
<title>VIZARD</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIZARD">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="join" class="join">
    <header class="top">
      <span class="brand"><img class="mark" src="/logo.svg" alt="" width="18" height="18"></span>
    </header>

    <div class="join-body">
      <img class="wm-lg" src="/wordmark.svg" alt="VIZARD" width="320" height="113">

      <form id="joinForm" class="form" autocomplete="off" novalidate>
        <label class="field">
          <span>Имя</span>
          <input id="nick" name="nick" type="text" maxlength="24" required autocapitalize="off" spellcheck="false">
        </label>
        <label class="field">
          <span>Ключ</span>
          <input id="pass" name="pass" type="password" maxlength="200" required autocomplete="new-password">
        </label>
        <label class="check">
          <input id="remember" type="checkbox">
          <span>Запомнить на этом устройстве</span>
        </label>
        <p id="joinError" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="joinBtn" type="submit" class="btn">Войти</button>
          <span id="install" class="install" hidden>
            <button id="installBtn" type="button" class="link" hidden>Установить приложение</button>
            <span id="iosHint" class="hint" hidden>Поделиться → На экран «Домой»</span>
          </span>
        </div>
      </form>

    </div>
  </section>

  <section id="chat" class="chat" hidden>
    <header class="top bar">
      <span class="brand"><img id="markBar" class="mark" src="/logo.svg" alt="" width="18" height="18"><img class="wm-sm" src="/wordmark.svg" alt="VIZARD" width="74" height="26"></span>
      <span class="meta">
        <span class="room" title="Отпечаток комнаты">#<b id="fp">····</b></span>
        <span id="conn" class="conn" data-state="connecting"><i></i><b id="connText"></b></span>
        <span id="me" class="me"></span>
        <button id="installBar" class="link" type="button" hidden>установить</button>
        <button id="leave" class="link" type="button">выйти</button>
      </span>
    </header>

    <div id="warn" class="warn" hidden></div>

    <main id="scroller" class="scroller">
      <ol id="list" class="list" aria-live="polite"></ol>
      <div id="empty" class="empty" hidden>Пусто. Напишите первым.</div>
    </main>

    <button id="jump" class="jump" type="button" hidden>Новые ↓</button>

    <footer class="composer">
      <div id="typing" class="typing"></div>
      <form id="sendForm" class="send">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Сообщение" enterkeyhint="send" aria-label="Сообщение"></textarea>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </form>
      <div id="counter" class="counter" hidden></div>
    </footer>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
